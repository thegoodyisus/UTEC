<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroCredit — ¿Quién eres?</title>
  <link rel="stylesheet" href="../design-system/tokens/tokens.css" />
  <link rel="stylesheet" href="../design-system/styles/base.css" />
  <link rel="stylesheet" href="assets/prototype.css" />
</head>
<body>
  <div class="screen screen--brand">

    <!-- Sin flecha (es la primera pantalla): header vacío para igualar la altura del hero con las bienvenidas -->
    <header class="flow-header flow-header--brand" aria-hidden="true"></header>

    <!-- Hero verde: MISMA estructura que las bienvenidas (saludo + logo + selector de idioma) -->
    <section class="welcome">
      <div class="welcome__greetings" aria-live="polite">
        <p class="welcome__greeting welcome__greeting--main" data-i18n="hello">Bienvenido a</p>
      </div>

      <!-- Logo AgroCredit (variante fondo verde) -->
      <div class="brand-lockup brand-lockup--on-green" role="img" aria-label="AgroCredit">
        <p class="brand-lockup__wordmark">
          <span class="brand-lockup__agro">Agro</span><span class="brand-lockup__credit">Credit</span>
          <span class="brand-lockup__leaf" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="hoja-a" d="M11.6 22C4.8 21.3 1.2 15.4 2.2 5.6c6.8.3 10.6 6.2 9.4 16.4Z" fill="currentColor"/><path class="hoja-b" d="M12.4 22c-.9-10.6 3.4-17.6 9.6-19.6 2 10-2.4 18.2-9.6 19.6Z" fill="var(--color-leaf-light, #75b175)"/><path d="M11.2 21C9.4 16 6.9 11.6 4 8.4M12.9 21c1.6-5.4 4.2-10.2 7.6-14.4" stroke="rgba(255,255,255,0.55)" stroke-width="0.9" stroke-linecap="round"/></svg>
          </span>
        </p>
      </div>

      <div class="lang-picker lang-picker--spaced" role="group" aria-label="Selector de idioma">
        <span class="lang-picker__label" data-i18n="langLabel">Elige tu idioma</span>
        <button class="lang-chip is-selected" type="button" data-lang-btn="es" data-testid="lang-es" onclick="setLang('es')">Español</button>
        <button class="lang-chip" type="button" data-lang-btn="qu" data-testid="lang-qu" onclick="setLang('qu')">Runa Simi (Quechua)</button>
        <button class="lang-chip" type="button" data-lang-btn="ay" data-testid="lang-ay" onclick="setLang('ay')">Aymara</button>
      </div>
    </section>

    <!-- Sheet blanca inferior (misma posición que la sheet de beneficios de las bienvenidas): pregunta + roles -->
    <section class="sheet sheet--lower">
      <p class="screen__subtitle" data-i18n="roleQuestion" style="font-weight: var(--font-weight-bold); color: var(--color-text); text-align:center;">¿Cómo quieres usar AgroCredit?</p>

      <div class="role-picker role-picker--light" role="group" aria-label="Selecciona tu rol">
        <!-- Agricultor -->
        <button class="role-card" type="button" data-testid="rol-agricultor" onclick="elegirRol('agricultor')">
          <span class="role-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"/><path d="M12 12c-4 0-6-2-6-6 4 0 6 2 6 6Z" fill="currentColor" stroke="none"/><path d="M12 11c0-4 2-6 6-6 0 4-2 6-6 6Z" fill="currentColor" stroke="none" opacity="0.75"/></svg>
          </span>
          <span class="role-card__body">
            <p class="role-card__title" data-i18n="roleFarmerT">Soy Agricultor</p>
            <p class="role-card__desc" data-i18n="roleFarmerD">Publica tu producción y encuentra compradores formales.</p>
          </span>
          <span class="role-card__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </span>
        </button>

        <!-- Comprador -->
        <button class="role-card" type="button" data-testid="rol-comprador" onclick="elegirRol('comprador')">
          <span class="role-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H3"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg>
          </span>
          <span class="role-card__body">
            <p class="role-card__title" data-i18n="roleBuyerT">Soy Comprador</p>
            <p class="role-card__desc" data-i18n="roleBuyerD">Encuentra producción disponible y reserva volumen de agricultores.</p>
          </span>
          <span class="role-card__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </span>
        </button>
      </div>

      <p class="mock-note" id="rol-msg" style="min-height: 18px;"></p>
    </section>

  </div>
  <script src="../assets/vendor/amazon-cognito-identity-6.3.20.min.js"></script>
  <script src="../assets/agro.js"></script>
  <script src="assets/prototype.js"></script>
  <script>
    window.elegirRol = function (rol) {
      Agro.reiniciarFlujo(rol);
      if (rol === "agricultor") {
        goTo("01-bienvenida.html");
      } else {
        goTo("comprador-01-bienvenida.html");
      }
    };
  </script>
</body>
</html>
