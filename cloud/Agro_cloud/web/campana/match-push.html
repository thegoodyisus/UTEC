<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroCredit — Notificación</title>
  <link rel="stylesheet" href="../design-system/tokens/tokens.css" />
  <link rel="stylesheet" href="../design-system/styles/base.css" />
  <link rel="stylesheet" href="../design-system/components/primary-button/primary-button.css" />
  <link rel="stylesheet" href="assets/campana.css" />
  <style>
    .lockscreen {
      background: linear-gradient(160deg, #418e49, #135c40);
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: var(--space-6);
      padding: var(--space-10) var(--space-4);
    }
    .lockscreen__clock { color: #fff; text-align: center; }
    .lockscreen__clock .h { font-size: 56px; font-weight: var(--font-weight-bold); font-family: var(--font-family-titles); }
    .lockscreen__clock .d { opacity: 0.9; }
  </style>
</head>
<body style="visibility:hidden">
  <div class="screen" style="background: transparent;">
    <div class="lockscreen">
      <div class="lockscreen__clock">
        <div class="h">9:41</div>
        <div class="d">martes, 29 de septiembre</div>
      </div>

      <button class="push" type="button" style="width:100%; text-align:left; cursor:pointer;" data-testid="push-notif" onclick="goTo('ofertas-campana.html')">
        <span class="push__app">A</span>
        <span>
          <strong style="display:block;">AgroCredit</strong>
          <span style="display:block; font-weight: var(--font-weight-bold);">¡Tienes una nueva oferta!</span>
          <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">Un comprador está interesado en tu campaña.</span>
        </span>
      </button>

      <p class="mock-note" style="color:#fff; opacity:0.9;">Notificación push simulada · toca para abrir</p>
      <button class="btn btn--secondary btn--block" type="button" style="max-width:300px; background:transparent; color:#fff; border-color:#fff;" data-testid="push-abrir" onclick="goTo('ofertas-campana.html')">Abrir la app</button>
    </div>
  </div>
  <script src="../assets/vendor/amazon-cognito-identity-6.3.20.min.js"></script>
  <script src="../assets/agro.js"></script>
  <script src="assets/campana.js"></script>
<script>
    //paso simulado que se mantiene (decision 54, respuesta 1b): solo guarda de navegacion
    Agro.proteger({ fase: "app", rol: "agricultor" });
  </script>
</body>
</html>
