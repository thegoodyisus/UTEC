<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroCredit — Oferta aceptada</title>
  <link rel="stylesheet" href="../design-system/tokens/tokens.css" />
  <link rel="stylesheet" href="../design-system/styles/base.css" />
  <link rel="stylesheet" href="../design-system/components/primary-button/primary-button.css" />
  <link rel="stylesheet" href="assets/campana.css" />
</head>
<body style="visibility:hidden">
  <div class="screen screen--brand">

    <div class="success">
      <span class="success__icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20c0-8 6-14 16-15-1 10-7 15-16 15Z" fill="#418e49"/><path d="M9 17c2-3 5-5 8-6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      <h1 class="success__title">¡Oferta aceptada!</h1>
      <p class="success__text" id="acc-text">Tu operación quedó registrada con el comprador.</p>
      <div class="summary-list" id="acc-resumen"></div>
    </div>

    <div class="screen__body" style="flex:0 0 auto;">
    </div>

    <div class="screen__footer" style="background: transparent;">
      <button class="btn btn--secondary btn--block" type="button" data-testid="acc-continuar-button" onclick="goTo('home.html')">Ir al inicio</button>
    </div>

  </div>
  <script src="../assets/vendor/amazon-cognito-identity-6.3.20.min.js"></script>
  <script src="../assets/agro.js"></script>
  <script src="assets/campana.js"></script>
  <script>
    var c = getCampaign();
    var u = unitLabel(c.unidad);
    document.getElementById("acc-resumen").innerHTML = [
      ["Comprador", (c.ofertaSeleccionada && c.ofertaSeleccionada.comprador) || "—"],
      ["Modalidad", c.modalidadElegida],
      ["Volumen comprometido", c.volumenComprometido.toLocaleString("es-PE") + " " + u],
      ["Adelanto recibido", c.adelanto ? money(c.adelanto) : "—"]
    ].map(function (r) { return '<div class="summary-list__row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join("");
  </script>
<script>
    //paso simulado que se mantiene (decision 54, respuesta 1b): solo guarda de navegacion
    Agro.proteger({ fase: "app", rol: "agricultor" });
  </script>
</body>
</html>
