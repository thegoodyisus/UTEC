<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroCredit — Campaña publicada</title>
  <link rel="stylesheet" href="../design-system/tokens/tokens.css" />
  <link rel="stylesheet" href="../design-system/styles/base.css" />
  <link rel="stylesheet" href="../design-system/components/primary-button/primary-button.css" />
  <link rel="stylesheet" href="assets/campana.css" />
</head>
<body style="visibility:hidden">
  <div class="screen screen--brand">

    <div class="success">
      <span class="success__icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20c0-8 6-14 16-15-1 10-7 15-16 15Z" fill="#418e49"/><path d="M9 17c2-3 5-5 8-6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/></svg>
      </span>
      <h1 class="success__title">¡Tu campaña fue publicada! 🌱</h1>
      <p class="success__text">Ahora compradores interesados podrán encontrar tu producción y enviarte ofertas.</p>
      <div class="summary-list" id="resumen" aria-label="Resumen de la campaña publicada"></div>
    </div>

    <div class="screen__footer" style="background: transparent;">
      <button class="btn btn--primary btn--block" type="button" data-testid="pub-ir-inicio-button" onclick="goTo('home.html')">Ir a Inicio</button>
      <p class="mock-note" style="color: var(--color-on-secondary);">Registrada en la base de datos · demo académica</p>
    </div>

    <!-- Notificación push de correo (simulada): banner superior que entra deslizándose desde arriba -->
    <div class="push-banner" id="push-banner">
      <button class="push" type="button" id="push-correo" role="status" style="width:100%; text-align:left; cursor:pointer;" aria-label="Notificación de correo: tu campaña fue publicada">
        <span class="push__app">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
        </span>
        <span>
          <strong style="display:block;">Correo · AgroCredit</strong>
          <span style="display:block; font-weight: var(--font-weight-bold); font-size: var(--font-size-sm);">Tu campaña fue publicada</span>
          <span style="font-size: var(--font-size-body-small); color: var(--color-text-secondary);">Notificación simulada: en esta demo no se envían correos de ofertas.</span>
        </span>
      </button>
    </div>

  </div>
  <script src="../assets/vendor/amazon-cognito-identity-6.3.20.min.js"></script>
  <script src="../assets/agro.js"></script>
  <script src="assets/campana.js"></script>
  <script>
    Agro.proteger({ fase: "app", rol: "agricultor" }).then(function () {
      var id = Agro.parametro("id");
      if (!id) { location.replace("home.html"); return; }
      return Promise.all([Agro.api("GET", "/campanas/" + id), Agro.catalogo()]).then(function (r) {
        var c = r[0], cat = r[1];
        var rows = [["Cultivo", Agro.nombreCultivo(cat, c.cultivo)], ["Volumen", Agro.kg(c.volumenKg)], ["Fecha estimada", c.cosecha], ["Ubicación", c.departamento + " · " + c.distrito]];
        document.getElementById("resumen").innerHTML = rows.map(function (x) {
          return '<div class="summary-list__row"><span>' + x[0] + '</span><span>' + Agro.escapar(x[1]) + '</span></div>';
        }).join("");
      });
    });
    var banner = document.getElementById("push-banner");
    setTimeout(function () { banner.classList.add("is-visible"); }, 700);
    document.getElementById("push-correo").addEventListener("click", function () { banner.classList.remove("is-visible"); });
    setTimeout(function () { banner.classList.remove("is-visible"); }, 6000);
  </script>
</body>
</html>
