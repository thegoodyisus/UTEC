      type: object
      required: [tipoDoc, documento, demo]
      properties:
        tipoDoc:
          type: string
          enum: [RUC, DNI]
        documento:
          type: string
        demo:
          type: boolean
          description: Siempre true; los datos son ficticios.
        razonSocial:
          type: string
        direccionFiscal:
          type: string
        actividad:
          type: string
        estado:
          type: string
          examples: ["Activo · Habido"]
        nombres:
          type: string
        apellidos:
          type: string
        celular:
          type: string
        correo:
          type: string
