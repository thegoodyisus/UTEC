    PadronConsulta:
      type: object
      required: [tipoDoc, documento, uso]
      properties:
        tipoDoc:
          type: string
          enum: [RUC, DNI]
        documento:
          type: string
          pattern: '^([0-9]{8}|[0-9]{11})$'
          description: 11 numeros si es RUC, 8 si es DNI. Lo escribe el usuario; no se valida contra un registro real.
        uso:
          type: string
          enum: [comprador, representante]
          description: comprador = pantalla de empresa; representante = pantalla de representante.
