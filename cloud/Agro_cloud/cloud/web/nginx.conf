#sitio estatico; /api/* nunca llega aqui (lo enruta el alb a la api)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  location = / {
    return 302 /onboarding/00-inicio.html;
  }

  #chequeo del alb; el json lo genera 40-salud.sh al arrancar (id de tarea y zona)
  location = /salud-web {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files /salud-web.json =503;
  }

  location ~* \.(html|js|css)$ {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
