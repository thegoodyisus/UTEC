# Web de Bart (React + Vite) en un bucket S3 publico como sitio web (patron de S11).
# Antes de desplegar: deben existir los stacks bart-chat-<stage> y bart-solicitudes-<stage> (se leen sus URLs).
service: bart-web
frameworkVersion: "4"

provider:
  name: aws
  region: ${opt:region, "us-east-1"}
  stage: ${opt:stage, "dev"}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

plugins:
  - serverless-s3-sync
  - serverless-plugin-scripts

custom:
  # Sufijo de los buckets (unicos en todo AWS): viene de 'sufijo' en credential.txt (variable BART_SUFIJO)
  sufijo: ${env:BART_SUFIJO}
  bucketName: bart-web-${sls:stage}-${self:custom.sufijo}
  s3Sync:
    - bucketName: ${self:custom.bucketName}
      localDir: dist
      deleteRemoved: true
      params:
        - index.html:
            CacheControl: "no-cache"
  scripts:
    hooks:
      # Escribe .env.production.local con las URLs reales y compila (funciona en Mac, Linux y Windows)
      "before:deploy:deploy": >-
        node scripts/escribir_env.mjs ${cf:bart-chat-${sls:stage}.ChatApiUrl} ${cf:bart-solicitudes-${sls:stage}.SolicitudesApiUrl}
        && npm run build

resources:
  Resources:
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        Tags:
          - { Key: proyecto, Value: bart }
          - { Key: datos, Value: sinteticos }
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: { Ref: WebBucket }
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: "s3:GetObject"
              Resource: !Sub "${WebBucket.Arn}/*"
  Outputs:
    WebsiteURL:
      Description: URL publica de la web de Bart
      Value: !GetAtt WebBucket.WebsiteURL
